<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Wallet App - Login or register to manage your digital wallet">
    <title>Wallet App - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>💰 Wallet App</h1>
        <p class="subtitle">Login or create a new account</p>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <button class="btn-primary" id="loginBtn" onclick="login()">Sign In</button>
        <button class="btn-secondary" id="registerBtn" onclick="register()">Create Account</button>

        <div class="message" id="message"></div>
    </div>

    <script>
        const API = "http://localhost:8080/api";

        // If already logged in, redirect to dashboard
        if (localStorage.getItem("walletEmail")) {
            window.location.href = "dashboard.html";
        }

        function showMessage(text, type) {
            const el = document.getElementById("message");
            el.textContent = text;
            el.className = "message " + type;
        }

        async function login() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!email || !password) {
                showMessage("Please fill in all fields.", "error");
                return;
            }

            try {
                const res = await fetch(API + "/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem("walletEmail", email);
                    window.location.href = "dashboard.html";
                } else {
                    showMessage(data.error || "Login failed.", "error");
                }
            } catch (err) {
                showMessage("Cannot connect to server. Is the backend running?", "error");
            }
        }

        async function register() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!email || !password) {
                showMessage("Please fill in all fields.", "error");
                return;
            }

            try {
                const res = await fetch(API + "/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    showMessage(data.message, "success");
                } else {
                    showMessage(data.error || "Registration failed.", "error");
                }
            } catch (err) {
                showMessage("Cannot connect to server. Is the backend running?", "error");
            }
        }

        // Allow Enter key to trigger login
        document.getElementById("password").addEventListener("keydown", function(e) {
            if (e.key === "Enter") login();
        });
    </script>
</body>
</html>
