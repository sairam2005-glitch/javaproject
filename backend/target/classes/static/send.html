<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Wallet App - Send money to another user">
    <title>Wallet App - Send Money</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>💸 Send Money</h1>
        <p class="subtitle">Transfer funds to another wallet user</p>

        <div class="form-group">
            <label for="toEmail">Recipient Email</label>
            <input type="email" id="toEmail" placeholder="recipient@example.com" required>
        </div>

        <div class="form-group">
            <label for="amount">Amount (₹)</label>
            <input type="number" id="amount" placeholder="Enter amount" min="1" step="0.01" required>
        </div>

        <button class="btn-primary" id="sendBtn" onclick="sendMoney()">Send Money</button>
        <button class="btn-secondary" onclick="window.location.href='dashboard.html'">← Back to Dashboard</button>

        <div class="message" id="message"></div>
    </div>

    <script>
        const API = "http://localhost:8080/api";
        const email = localStorage.getItem("walletEmail");

        // Redirect to login if not logged in
        if (!email) {
            window.location.href = "login.html";
        }

        function showMessage(text, type) {
            const el = document.getElementById("message");
            el.textContent = text;
            el.className = "message " + type;
        }

        async function sendMoney() {
            const toEmail = document.getElementById("toEmail").value.trim();
            const amount = document.getElementById("amount").value.trim();

            if (!toEmail || !amount) {
                showMessage("Please fill in all fields.", "error");
                return;
            }

            if (parseFloat(amount) <= 0) {
                showMessage("Amount must be greater than zero.", "error");
                return;
            }

            const sendBtn = document.getElementById("sendBtn");
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span class="spinner"></span> Sending...';

            try {
                const res = await fetch(API + "/send", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        fromEmail: email,
                        toEmail: toEmail,
                        amount: parseFloat(amount)
                    })
                });
                const data = await res.json();

                if (res.ok) {
                    showMessage(data.message, "success");
                    document.getElementById("toEmail").value = "";
                    document.getElementById("amount").value = "";
                } else {
                    showMessage(data.error || "Transfer failed.", "error");
                }
            } catch (err) {
                showMessage("Cannot connect to server.", "error");
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = "Send Money";
            }
        }

        // Allow Enter key to trigger send
        document.getElementById("amount").addEventListener("keydown", function(e) {
            if (e.key === "Enter") sendMoney();
        });
    </script>
</body>
</html>
